name: ledgerflow_finance
version: 1.0.0
config-version: 2
profile: ledgerflow_finance
model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  ledgerflow_finance:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: incremental
      +incremental_strategy: delete+insert
      +schema: finance
      +on_schema_change: fail

