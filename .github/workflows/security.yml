name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap secure packaging toolchain
        run: >-
          python -m pip install --upgrade
          "pip==26.2.1"
          "setuptools==84.0.0"
          "wheel==0.47.0"
      - name: Install application and security tools
        run: >-
          python -m pip install -e ".[aws]"
          "bandit==1.9.4"
          "pip-audit==2.10.1"
      - name: Scan source code
        run: bandit -q -r src lambdas spark_jobs
      - name: Audit installed dependencies
        run: pip-audit --local
